<!--
PROJECT REQUIREMENTS — DO NOT REMOVE

Aplicación: JerkSimulator
Autor del código original: Raymundo Ortiz
Versión: V4.3.2
Licencia: GNU GPL version 3 or later (SPDX: GPL-3.0-or-later)
Repositorio: https://github.com/FireRayo/JerkSimulator/

Restricciones técnicas permanentes:
- Un único archivo HTML5 autocontenido para ejecución; HTML5 + CSS3 + JavaScript puro.
- Funciones esenciales 100% offline y compatibles con file:// en navegadores modernos.
- Sin CDN, frameworks, fuentes remotas, APIs obligatorias ni recursos externos de ejecución.
- Interfaz Neomorphism / Soft UI con temas Light y Dark y las paletas exactas del Prompt Maestro V1.2.
- i18n completo: en (predeterminado), es, it, pt-BR; preferencias persistentes cuando localStorage está disponible.
- Texto visible en inglés redactado con principios de claridad ASD-STE100; traducciones equivalentes claras y técnicas.
- Comentarios internos de desarrollo en español; nombres de funciones, variables, IDs y estructuras en inglés.
- About con metadatos centralizados y acceso offline al texto completo GPLv3 embebido.
- La física usa solución analítica exacta por segmentos, no integración Euler.
- Se conservan comparación de corridas, cursor sincronizado, zoom/pan, animación, muestreo adaptativo y CSV de alta precisión.
- El menú superior de gráficas contiene Language, Theme, Print to PDF y About, en ese orden.
- Las herramientas de comparación/zoom se ubican al final de la columna izquierda de controles.
- Los controles Play, Stop y Speed de la animación usan una distribución amplia, centrada y uniforme.
- Las dos columnas principales participan en el mismo desplazamiento vertical de la página; ninguna columna usa posicionamiento sticky.

Convención de Jerk = 0 incorporada en V4.1.0:
- Un límite de jerk igual a 0 NO representa da/dt = 0 durante una transición de aceleración.
- En la interfaz significa «S-curve smoothing disabled» para esa transición, equivalente al perfil clásico de rampa lineal de velocidad.
- La aceleración cambia instantáneamente en esa frontera y el jerk matemático es un impulso ideal no acotado (±∞).
- Entre cambios instantáneos, jerk = 0 y la aceleración es constante.
- En modo independiente, cada Ji puede ser 0 de forma individual, produciendo un perfil híbrido.

Componentes de terceros incluidos: ninguno.
El texto íntegro GNU GPLv3 se incluye como dato no ejecutable y conserva su redacción oficial.
-->

<!--
CHANGELOG — VERSION HISTORY

V1.0
- Primera versión: perfil S-curve de 7 tramos, integración temporal, gráficas, animación y CSV.

V2.0
- Sustitución de Euler por propagación polinómica exacta por tramo.
- Muestreo separado de la exactitud física; mejoras de gráficas y comparación.

V2.1
- Modos Single jerk e Independent jerks.
- Velocidades V0/Vf, cursor sincronizado, zoom/pan y mejoras de exportación.

V2.2
- Validación explícita de límites y residuo del solver.
- Muestreo adaptativo, CSV de precisión completa, fronteras temporales robustas y optimización de renderizado/animación.

V4.0
- Identificación de la rama validada como versión V4.0.

V4.1.0
- Jerk = 0 ahora selecciona una transición de rampa lineal ideal con salto instantáneo de aceleración.
- Soporte de perfiles trapezoidales completos e híbridos por Ji independiente.
- Gráfica de aceleración con discontinuidades verticales exactas y gráfica de jerk con impulsos ideales ±∞.
- Añadidos temas Light/Dark Neomorphism, i18n en/es/it/pt-BR, metadatos centralizados, About ampliado y GPLv3 íntegra offline.
- Añadido registro permanente de requisitos y changelog conforme al Prompt Maestro V1.2.

V4.2.0
- Valores predeterminados actualizados: S=2000 mm, Vmax=500 mm/s, Amax=Dmax=300 mm/s², jerk=500 mm/s³, V0=Vf=0 y 1000 muestras.
- La aplicación calcula y muestra automáticamente las gráficas del perfil predeterminado al abrirse.
- Velocidades de frontera y muestreo movidos a un panel avanzado colapsable, cerrado por defecto.
- Métricas visibles y resumen de segmentos limitados a 2 decimales; el CSV conserva precisión completa.
- Nombre JerkSimulator normalizado en metadatos, interfaz y nombre del archivo CSV exportado.

V4.3.0
- Menú superior de gráficas reorganizado con About, Language, Theme y Print to PDF.
- Herramientas de comparación, borrado de corrida anterior, reset de zoom y ayuda de interacción movidas a una tarjeta final debajo de la animación.
- Botones Simulate, Reset y Export CSV ampliados, centrados y distribuidos uniformemente en todo el ancho del panel de control.
- Añadidos estilos de impresión para optimizar la salida mediante el diálogo nativo Print / Save as PDF del navegador.

V4.3.1
- Eliminado el posicionamiento sticky de la columna izquierda.
- Ambas columnas principales ahora se desplazan juntas verticalmente con la página.
- Se permite que cada columna termine a una altura diferente sin intentar mantener alineados sus bordes inferiores.

V4.3.2
- Reordenado el menú superior: Language, Theme, Print to PDF y About.
- La sección Chart comparison and view tools se movió al final de la columna izquierda.
- Los controles Play, Stop y Speed de la animación se ampliaron, centraron y distribuyeron uniformemente.
- El control Repeat se conserva y queda centrado dentro del grupo de controles de animación.
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<title>JerkSimulator V4.3.2</title>
<style>

  --text: #E6EAF0; --text-muted: #9CA6B2; --accent-light: #739DF2; --accent: #5C7FD6; --accent-dark: #4868B8;

  --text: #30363B; --text-muted: #687078; --accent-light: #6C9EFF; --accent: #557BD9; --accent-dark: #526FC0;
  --ok: #3D8B62; --warn: #9B6B27; --err: #A44E4E;
}
*{box-sizing:border-box} html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Cantarell,Arial,sans-serif}
body{transition:background .2s,color .2s} h1{font-size:1.58rem;margin:0 0 5px} h2{font-size:1rem;margin:0 0 10px;color:var(--text-muted);font-weight:650} h3{font-size:.92rem;margin:10px 0 8px}
.wrap{max-width:1380px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}.grid{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card,.soft-panel{background:var(--surface);border:0;border-radius:var(--radius);box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);padding:16px}.soft-panel{box-shadow:inset 3px 3px 7px var(--shadow-dark),inset -3px -3px 7px var(--shadow-light);padding:10px}
.top-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}.compact-field label{margin-bottom:4px}.section-divider{height:1px;margin:4px 4px 0;background:var(--shadow-dark);opacity:.35}
.top-menu{padding:13px 14px}.top-menu .utility-button{width:100%;min-height:42px}.top-menu .compact-field{min-width:0}.top-menu select{min-height:42px}
.main-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.main-actions button{width:100%;min-height:50px;padding:12px 10px;text-align:center;justify-content:center;font-size:clamp(.9rem,1.25vw,1.02rem)}
.motion-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px;align-items:stretch}.motion-actions button{width:100%;min-height:50px;padding:12px 10px;text-align:center;justify-content:center;font-size:clamp(.9rem,1.25vw,1.02rem)}.speed-control{min-height:50px;padding:8px 12px;border-radius:12px;background:var(--surface);box-shadow:inset 3px 3px 7px var(--shadow-dark),inset -3px -3px 7px var(--shadow-light);display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}.speed-control label{margin:0;white-space:nowrap;font-weight:700}.speed-control input[type="range"]{width:100%;min-width:90px}.motion-repeat{grid-column:1/-1;justify-self:center;margin-top:1px}
.comparison-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px}.comparison-toolbar h2{width:100%;margin:0 0 2px}.comparison-toolbar .hint{color:var(--text-muted);font-size:.8rem;margin-left:auto}.left-comparison{margin-top:14px}.left-comparison .hint{margin-left:0;width:100%;line-height:1.35}
label{font-size:.84rem;color:var(--text-muted);display:block;margin-bottom:4px} input[type="number"],select{width:100%;background:var(--surface);color:var(--text);border:0;border-radius:11px;padding:9px 10px;font-size:.94rem;outline:none;box-shadow:inset 3px 3px 7px var(--shadow-dark),inset -3px -3px 7px var(--shadow-light)} input:focus,select:focus{outline:2px solid var(--accent-light);outline-offset:1px}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px;background:var(--surface);border-radius:13px;box-shadow:inset 3px 3px 7px var(--shadow-dark),inset -3px -3px 7px var(--shadow-light)}.mode-option{position:relative;margin:0;cursor:pointer}.mode-option input{position:absolute;opacity:0}.mode-option span{display:flex;align-items:center;justify-content:center;min-height:38px;padding:8px;border-radius:10px;color:var(--text-muted);font-size:.84rem;font-weight:700}.mode-option input:checked+span{color:var(--text);background:var(--surface);box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light)}
.jerk-panel{background:var(--surface);border-radius:12px;padding:10px;box-shadow:inset 3px 3px 7px var(--shadow-dark),inset -3px -3px 7px var(--shadow-light)}
.advanced-details{margin-top:4px;border-radius:12px;background:var(--surface);box-shadow:inset 2px 2px 5px var(--shadow-dark),inset -2px -2px 5px var(--shadow-light);overflow:hidden}
.advanced-details summary{cursor:pointer;list-style:none;padding:11px 12px;color:var(--text);font-size:.9rem;font-weight:700;user-select:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.advanced-details summary::-webkit-details-marker{display:none}.advanced-details summary::after{content:'▸';color:var(--accent);font-size:1rem;transition:transform .15s}.advanced-details[open] summary::after{transform:rotate(90deg)}
.advanced-details .advanced-content{padding:2px 10px 11px;display:grid;gap:10px}
.advanced-details[open] summary{color:var(--accent)}
.note{margin-top:7px;color:var(--text-muted);font-size:.77rem;line-height:1.38}.zero-note{border-left:3px solid var(--accent);padding-left:9px;margin-top:9px}[hidden]{display:none!important}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}.grow{flex:1 1 auto}button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;color:var(--text);background:var(--surface);box-shadow:4px 4px 9px var(--shadow-dark),-4px -4px 9px var(--shadow-light);transition:transform .08s,box-shadow .08s,color .15s}button:hover{color:var(--accent)}button:active{transform:translateY(1px);box-shadow:inset 3px 3px 7px var(--shadow-dark),inset -3px -3px 7px var(--shadow-light)}button.primary{color:#fff;background:var(--accent);box-shadow:4px 4px 9px var(--shadow-dark),-3px -3px 8px var(--shadow-light)}button:disabled{opacity:.45;cursor:not-allowed}
.chart-card{padding:10px}.chart-card h2{color:var(--text);margin:2px 4px 9px}.chart-note{font-size:.77rem;color:var(--text-muted);margin:8px 7px 1px}
canvas{width:100%;height:250px;display:block;background:var(--surface);border:0;border-radius:12px;box-shadow:inset 4px 4px 9px var(--shadow-dark),inset -4px -4px 9px var(--shadow-light);touch-action:none}.kvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.kv,.segment-chip{background:var(--surface);border-radius:10px;padding:8px 10px;box-shadow:inset 2px 2px 5px var(--shadow-dark),inset -2px -2px 5px var(--shadow-light);min-width:0}.kv .k,.segment-chip .n{color:var(--text-muted);font-size:.74rem}.kv .v{font-weight:750;font-size:.96rem;overflow-wrap:anywhere}.segments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}.segment-chip .d{font-size:.82rem;font-weight:650;margin-top:2px}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.badge{display:inline-flex;align-items:center;color:var(--text-muted);font-size:.79rem}.spinner{display:none;gap:9px;align-items:center;margin-top:10px;color:var(--text-muted);font-size:.86rem}.spinner.on{display:flex}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:bounce 1s infinite ease-in-out}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,80%,100%{transform:scale(.8);opacity:.55}40%{transform:scale(1.2);opacity:1}}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}.muted{color:var(--text-muted)}.check{display:inline-flex;gap:7px;align-items:center;color:var(--text-muted);font-size:.86rem;user-select:none}.check input{width:16px;height:16px;accent-color:var(--accent)}input[type="range"]{accent-color:var(--accent)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
#motionCanvas{height:150px}dialog{border:0;background:var(--surface);color:var(--text);border-radius:16px;padding:18px;box-shadow:10px 10px 22px var(--shadow-dark),-8px -8px 18px var(--shadow-light);max-width:620px}dialog::backdrop{background:rgba(0,0,0,.46)}.about-grid{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:.9rem}.about-grid .k{color:var(--text-muted)}#licenseDialog{width:min(920px,94vw);max-width:920px}#licenseText{max-height:66vh;overflow:auto;white-space:pre-wrap;font:12px/1.42 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface);color:var(--text);padding:14px;border-radius:12px;box-shadow:inset 3px 3px 7px var(--shadow-dark),inset -3px -3px 7px var(--shadow-light)}
@media(max-width:980px){.wrap{grid-template-columns:1fr}.top-controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.row,.kvs,.segments,.top-controls,.main-actions,.motion-actions{grid-template-columns:1fr}.motion-repeat{grid-column:1}.comparison-toolbar .hint{margin-left:0;width:100%}}
@media print{
  :root,html[data-theme="dark"],html[data-theme="light"]{--bg:#fff;--surface:#fff;--text:#000;--text-muted:#444;--shadow-light:#fff;--shadow-dark:#fff}
  body{background:#fff!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{display:block;max-width:none;margin:0;padding:0}.card{box-shadow:none!important;border:1px solid #bbb!important;margin:0 0 12px;break-inside:avoid}.top-menu,.comparison-toolbar,.main-actions,.motion-actions,.spinner,.footer button{display:none!important}
  canvas{box-shadow:none!important;border:1px solid #bbb!important;break-inside:avoid;page-break-inside:avoid}.chart-card{break-inside:avoid;page-break-inside:avoid}dialog{display:none!important}
}
</style>
</head>

<body>
<div class="wrap">
  <section class="card" id="controls">
    <h1 data-i18n="app.title">JerkSimulator</h1>
    <h2 data-i18n="app.subtitle"></h2>
    <div class="note" data-i18n="units.note"></div>

    <div class="grid">
      <h3 data-i18n="section.motion"></h3>
      <div class="row">
        <div><label for="inDist" data-i18n="label.distance"></label><input type="number" id="inDist" min="0" step="1" value="2000"></div>
        <div><label for="inVmax" data-i18n="label.vmax"></label><input type="number" id="inVmax" min="0" step="1" value="500"></div>
      </div>
      <div class="row">
        <div><label for="inAmax" data-i18n="label.amax"></label><input type="number" id="inAmax" min="0" step="1" value="300"></div>
        <div><label for="inDmax" data-i18n="label.dmax"></label><input type="number" id="inDmax" min="0" step="1" value="300"></div>
      </div>

      <div class="section-divider"></div><h3 data-i18n="section.jerk"></h3>
      <div class="mode-switch" role="radiogroup">
        <label class="mode-option"><input type="radio" name="jerkMode" id="jerkModeSingle" value="single" checked><span data-i18n="mode.single"></span></label>
        <label class="mode-option"><input type="radio" name="jerkMode" id="jerkModeIndependent" value="independent"><span data-i18n="mode.independent"></span></label>
      </div>
      <div class="jerk-panel" id="singleJerkPanel">
        <label for="inJmax" data-i18n="label.jmax"></label><input type="number" id="inJmax" min="0" step="1" value="500">
        <div class="note" data-i18n="note.jerkSingle"></div>
      </div>
      <div class="jerk-panel" id="independentJerkPanel" hidden>
        <div class="row"><div><label for="inJ1" data-i18n="label.j1"></label><input type="number" id="inJ1" min="0" step="1" value="500"></div><div><label for="inJ2" data-i18n="label.j2"></label><input type="number" id="inJ2" min="0" step="1" value="500"></div></div>
        <div class="row" style="margin-top:10px"><div><label for="inJ3" data-i18n="label.j3"></label><input type="number" id="inJ3" min="0" step="1" value="500"></div><div><label for="inJ4" data-i18n="label.j4"></label><input type="number" id="inJ4" min="0" step="1" value="500"></div></div>
        <div class="note" data-i18n="note.jerkIndependent"></div>
      </div>
      <div class="note zero-note" data-i18n="note.jerkZero"></div>

      <div class="section-divider"></div>
      <details class="advanced-details" id="boundaryDetails">
        <summary data-i18n="section.boundary"></summary>
        <div class="advanced-content">
          <div class="row"><div><label for="inV0" data-i18n="label.v0"></label><input type="number" id="inV0" min="0" step="1" value="0"></div><div><label for="inVf" data-i18n="label.vf"></label><input type="number" id="inVf" min="0" step="1" value="0"></div></div>
          <div><label for="inSamples" data-i18n="label.samples"></label><input type="number" id="inSamples" min="200" max="5000" step="100" value="1000"></div>
        </div>
      </details>
    </div>

    <div class="main-actions"><button id="btnRun" class="primary" data-i18n="btn.simulate"></button><button id="btnReset" data-i18n="btn.reset"></button><button id="btnCSV" data-i18n="btn.export"></button></div>
    <div class="spinner" id="spinner"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span data-i18n="spinner"></span></div>
    <div id="msg" style="margin-top:9px"></div><div class="kvs" id="metrics" aria-live="polite"></div><div class="segments" id="segmentSummary" aria-live="polite"></div>
    <div class="footer"><span class="badge" data-i18n="footer.exact"></span></div>
    <div class="soft-panel comparison-toolbar left-comparison"><h2 data-i18n="section.chartTools"></h2><label class="check"><input type="checkbox" id="chkCompare"><span data-i18n="compare.overlay"></span></label><button id="btnClearCompare" data-i18n="btn.clearPrevious"></button><button id="btnResetZoom" data-i18n="btn.resetZoom"></button><span class="hint" data-i18n="charts.hint"></span></div>
  </section>

  <section class="grid">
    <div class="card top-menu"><div class="top-controls">
      <div class="compact-field"><label for="languageSelect" data-i18n="control.language"></label><select id="languageSelect"><option value="en">English</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt-BR">Português (Brasil)</option></select></div>
      <div class="compact-field"><label for="themeSelect" data-i18n="control.theme"></label><select id="themeSelect"><option value="light" data-i18n="theme.light"></option><option value="dark" data-i18n="theme.dark"></option></select></div>
      <button id="btnPrintPDF" class="utility-button" data-i18n="btn.printPDF"></button>
      <button id="btnAboutCard" class="utility-button" data-i18n="btn.about"></button>
    </div></div>
    <div class="card chart-card"><h2 data-i18n="chart.position"></h2><canvas id="chartX"></canvas></div>
    <div class="card chart-card"><h2 data-i18n="chart.velocity"></h2><canvas id="chartV"></canvas></div>
    <div class="card chart-card"><h2 data-i18n="chart.acceleration"></h2><canvas id="chartA"></canvas></div>
    <div class="card chart-card"><h2 data-i18n="chart.jerk"></h2><canvas id="chartJ"></canvas><div id="jerkGraphNote" class="chart-note" hidden data-i18n="jerkGraph.impulseNote"></div></div>
    <div class="card chart-card"><h2 data-i18n="chart.motion"></h2><canvas id="motionCanvas"></canvas><div class="motion-actions"><button id="btnToggle" class="primary" data-i18n="btn.play"></button><button id="btnStop" data-i18n="btn.stop"></button><div class="speed-control"><label class="muted" for="speed"><span data-i18n="label.speed"></span><span id="speedVal">1.00</span></label><input type="range" id="speed" min="0.25" max="4" step="0.25" value="1"></div><label class="check motion-repeat"><input type="checkbox" id="chkRepeat"><span data-i18n="label.repeat"></span></label></div><div class="kvs"><div class="kv"><div class="k">t</div><div class="v" id="anim_t">0.000 s</div></div><div class="kv"><div class="k">x</div><div class="v" id="anim_x">0.000 mm</div></div><div class="kv"><div class="k">v</div><div class="v" id="anim_v">0.000 mm/s</div></div></div></div>

  function appError(key, vars={}) { const e=new Error(tr(key,vars)); e.i18nKey=key; e.i18nVars=vars; return e; }

  function applyI18n() {
    document.documentElement.lang=currentLang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=tr(el.dataset.i18n); });
    byId('languageSelect').value=currentLang;
    byId('themeSelect').value=currentTheme;
    document.title=`${APP_CONFIG.name} ${APP_CONFIG.version}`;
    updateAbout();
    renderMessage();
    if (window.__lastProfile) showMetrics(window.__lastProfile);
    updateToggleLabel();
    updateJerkGraphNote();
    redrawCharts();
    resizeMotion();
  }

  function setLanguage(lang,persist=true) {
    currentLang=Object.prototype.hasOwnProperty.call(I18N,lang)?lang:'en';
    if (persist) safeStorageSet('JerkSimulator.language',currentLang);
    applyI18n();
  }

  function setTheme(theme,persist=true) {
    currentTheme=(theme==='light')?'light':'dark';
    document.documentElement.dataset.theme=currentTheme;
    if (persist) safeStorageSet('JerkSimulator.theme',currentTheme);
    if (byId('themeSelect')) byId('themeSelect').value=currentTheme;
    redrawCharts(); resizeMotion();
  }

  function updateAbout() {
    if (!byId('aboutTitle')) return;
    byId('aboutTitle').textContent=`${APP_CONFIG.name} ${APP_CONFIG.version}`;
    byId('aboutDescription').textContent=tr('about.description');
    byId('aboutApplication').textContent=APP_CONFIG.name;
    byId('aboutAuthor').textContent=APP_CONFIG.author;
    byId('aboutVersion').textContent=APP_CONFIG.version;
    byId('aboutLicense').textContent=APP_CONFIG.license;
    byId('aboutGithub').textContent=APP_CONFIG.github;
    byId('aboutGithub').href=APP_CONFIG.github;
  }

  function setMessage(key, vars={}, cls='') { messageState={key,vars,cls}; renderMessage(); }
  function renderMessage() {
    const el=byId('msg'); if (!el) return;
    if (!messageState) { el.className=''; el.textContent=''; return; }
    el.className=messageState.cls || '';
    el.textContent=messageState.key ? tr(messageState.key,messageState.vars) : (messageState.raw || '');
  }

  function scaledTol(...values) {
    let scale = 1;
    for (const value of values) {
      if (Number.isFinite(value)) scale = Math.max(scale, Math.abs(value));
    }
    return NUMERIC_FACTOR * EPS * scale;
  }

  function distanceTol(distance) {
    const scale=Math.max(1,Math.abs(distance));
    return Math.max(1e-9, Math.abs(distance)*1e-12, 512*EPS*scale);
  }

  function closeEnough(a, b, absTol=1e-12, relTol=128*EPS) {
    return Math.abs(a-b) <= absTol + relTol*Math.max(1,Math.abs(a),Math.abs(b));
  }

  function setMsg(text, cls='') { messageState={key:null,vars:{},cls,raw:String(text ?? '')}; const el=byId('msg'); el.className=cls; el.textContent=messageState.raw; }

  function setSpinner(on) { byId('spinner').classList.toggle('on', !!on); }

  function line(ctx, x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function safeMinMax(arr, i0=0, i1=arr ? arr.length : 0) {
    let min = Infinity, max = -Infinity;
    if (!arr) return {min:0, max:0, found:false};
    const end = Math.min(i1, arr.length);
    for (let i=Math.max(0,i0); i<end; i++) {
      const v = arr[i];
      if (!Number.isFinite(v)) continue;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    return {min, max, found: Number.isFinite(min) && Number.isFinite(max)};
  }

  function lowerBound(arr, value) {
    let lo = 0, hi = arr.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid] < value) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  function upperBound(arr, value) {
    let lo = 0, hi = arr.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid] <= value) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  // ---------------------------------------------------------------------------
  // Cinemática exacta
  // For a constant jerk j over dt:
  //   a1 = a0 + j*dt
  //   v1 = v0 + a0*dt + 1/2*j*dt^2
  //   x1 = x0 + v0*dt + 1/2*a0*dt^2 + 1/6*j*dt^3
  // These are exact polynomial solutions, not numerical integration.
  // ---------------------------------------------------------------------------
  function propagate(state, jerk, dt) {
    const dt2 = dt * dt;
    const dt3 = dt2 * dt;
    return {
      t: state.t + dt,
      x: state.x + state.v*dt + 0.5*state.a*dt2 + (jerk*dt3)/6,
      v: state.v + state.a*dt + 0.5*jerk*dt2,
      a: state.a + jerk*dt
    };
  }

  function accelTiming(deltaV, aMax, jUp, jDown) {
    const zeroTolV=scaledTol(deltaV);
    if (deltaV<=zeroTolV) return {t1:0,t2:0,t3:0,peakA:0,instantUp:false,instantDown:false};
    const invJ=(jUp>0?1/jUp:0)+(jDown>0?1/jDown:0);
    if (invJ===0) return {t1:0,t2:deltaV/aMax,t3:0,peakA:aMax,instantUp:true,instantDown:true};
    const dvAtAmax=0.5*aMax*aMax*invJ;
    const branchTolV=scaledTol(deltaV,dvAtAmax);
    if (deltaV<=dvAtAmax+branchTolV) {
      const peakA=Math.sqrt(Math.max(0,2*deltaV/invJ));
      return {t1:jUp>0?peakA/jUp:0,t2:0,t3:jDown>0?peakA/jDown:0,peakA,instantUp:jUp===0,instantDown:jDown===0};
    }
    return {t1:jUp>0?aMax/jUp:0,t2:Math.max(0,(deltaV-dvAtAmax)/aMax),t3:jDown>0?aMax/jDown:0,peakA:aMax,instantUp:jUp===0,instantDown:jDown===0};
  }

  function decelTiming(deltaV, dMax, jIn, jOut) {
    const zeroTolV=scaledTol(deltaV);
    if (deltaV<=zeroTolV) return {t1:0,t2:0,t3:0,peakD:0,instantIn:false,instantOut:false};
    const invJ=(jIn>0?1/jIn:0)+(jOut>0?1/jOut:0);
    if (invJ===0) return {t1:0,t2:deltaV/dMax,t3:0,peakD:dMax,instantIn:true,instantOut:true};
    const dvAtDmax=0.5*dMax*dMax*invJ;
    const branchTolV=scaledTol(deltaV,dvAtDmax);
    if (deltaV<=dvAtDmax+branchTolV) {
      const peakD=Math.sqrt(Math.max(0,2*deltaV/invJ));
      return {t1:jIn>0?peakD/jIn:0,t2:0,t3:jOut>0?peakD/jOut:0,peakD,instantIn:jIn===0,instantOut:jOut===0};
    }
    return {t1:jIn>0?dMax/jIn:0,t2:Math.max(0,(deltaV-dvAtDmax)/dMax),t3:jOut>0?dMax/jOut:0,peakD:dMax,instantIn:jIn===0,instantOut:jOut===0};
  }

  const SEGMENT_KEYS=['segment.1','segment.2','segment.3','segment.4','segment.5','segment.6','segment.7'];
  const SHORT_KEYS=['short.1','short.2','short.3','short.4','short.5','short.6','short.7'];

  function createSegmentDescriptors(vPeak, Tv, p) {
    const minPeak=Math.max(p.v0,p.vf);
    const lowerTolV=scaledTol(vPeak,minPeak)*8;
    if (!Number.isFinite(vPeak) || vPeak<minPeak-lowerTolV) throw appError('err.vpeakBelow');
    const upperTolV=scaledTol(vPeak,p.vMax)*8;
    if (Number.isFinite(p.vMax) && vPeak>p.vMax+upperTolV) throw appError('err.vpeakAbove');
    const acc=accelTiming(Math.max(0,vPeak-p.v0),p.aMax,p.j1,p.j2);
    const dec=decelTiming(Math.max(0,vPeak-p.vf),p.dMax,p.j3,p.j4);
    return [
      {nameKey:SEGMENT_KEYS[0],shortKey:SHORT_KEYS[0],jerk:p.j1>0?+p.j1:0,duration:acc.t1,targetA:+acc.peakA,instantaneous:acc.instantUp,impulseSign:+1},
      {nameKey:SEGMENT_KEYS[1],shortKey:SHORT_KEYS[1],jerk:0,duration:acc.t2,targetA:+acc.peakA,instantaneous:false,impulseSign:0},
      {nameKey:SEGMENT_KEYS[2],shortKey:SHORT_KEYS[2],jerk:p.j2>0?-p.j2:0,duration:acc.t3,targetA:0,instantaneous:acc.instantDown,impulseSign:-1},
      {nameKey:SEGMENT_KEYS[3],shortKey:SHORT_KEYS[3],jerk:0,duration:Math.max(0,Tv),targetA:0,instantaneous:false,impulseSign:0},
      {nameKey:SEGMENT_KEYS[4],shortKey:SHORT_KEYS[4],jerk:p.j3>0?-p.j3:0,duration:dec.t1,targetA:-dec.peakD,instantaneous:dec.instantIn,impulseSign:-1},
      {nameKey:SEGMENT_KEYS[5],shortKey:SHORT_KEYS[5],jerk:0,duration:dec.t2,targetA:-dec.peakD,instantaneous:false,impulseSign:0},
      {nameKey:SEGMENT_KEYS[6],shortKey:SHORT_KEYS[6],jerk:p.j4>0?+p.j4:0,duration:dec.t3,targetA:0,instantaneous:dec.instantOut,impulseSign:+1}
    ];
  }

  function buildExactModel(vPeak, Tv, p) {
    const desc=createSegmentDescriptors(vPeak,Tv,p);
    const segments=[];
    let state={t:0,x:0,v:p.v0,a:0};
    for (let i=0;i<desc.length;i++) {
      const d=desc[i];
      const start={...state};
      let end=propagate(start,d.jerk,d.duration);
      // Una transición instantánea cambia solo la aceleración; x, v y t permanecen continuos.
      if (d.instantaneous) end={...end,a:d.targetA};
      else end.a=d.targetA;
      // Estados analíticos conocidos en las fronteras principales.
      if (i===2) end.v=vPeak;
      if (i===3) {end.a=0;end.v=vPeak;}
      if (i===6) {end.a=0;end.v=p.vf;}
      segments.push({index:i,nameKey:d.nameKey,shortKey:d.shortKey,jerk:d.jerk,duration:d.duration,t0:start.t,t1:end.t,start,end,instantaneous:d.instantaneous,impulseSign:d.impulseSign,deltaA:end.a-start.a});
      state=end;
    }
    const zeroCount=[p.j1,p.j2,p.j3,p.j4].filter(j=>j===0).length;
    const modelKey=zeroCount===4?'model.trapezoidal':(zeroCount>0?'model.hybrid':'model.scurve');
    return {segments,tTotal:state.t,xTotal:state.x,vFinal:state.v,aFinal:state.a,vPeak,Tv,params:p,modelKey};
  }

  function transitionDistance(vPeak, p) {
    return buildExactModel(vPeak, 0, p).xTotal;
  }

  function evaluateAtTime(profile, time) {
    if (!profile || !profile.segments || !profile.segments.length) {
      return {t:0,x:0,v:0,a:0,j:0,segmentIndex:0,segmentKey:'segment.end'};
    }

    const t = clamp(time, 0, profile.tTotal);
    const segs = profile.segments;

    // Convention: internal boundaries are right-continuous (the segment beginning
    // at t_i owns t_i). At the final endpoint the motion has ended, so jerk = 0.
    if (t >= profile.tTotal) {
      const last = segs[segs.length-1];
      return {
        t:profile.tTotal,
        x:last.end.x,
        v:last.end.v,
        a:last.end.a,
        j:0,
        segmentIndex:last.index,
        segmentKey:'segment.end'
      };
    }

    let idx = 0;
    while (idx < segs.length-1 && t >= segs[idx].t1) idx++;
    const seg = segs[idx];
    const local = clamp(t - seg.t0, 0, seg.duration);
    const s = local === 0 ? seg.start : propagate(seg.start, seg.jerk, local);
    return {
      t,
      x:s.x,
      v:s.v,
      a:s.a,
      j:seg.jerk,
      segmentIndex:idx,
      segmentKey:seg.nameKey
    };
  }

  function sampleProfile(profile, requestedSamples) {
    const n = clamp(Math.round(requestedSamples), 200, 5000);
    const times = [];
    const total = profile.tTotal;

    if (!(total > 0)) {
      const s = evaluateAtTime(profile,0);
      return {T:[0],X:[s.x],V:[s.v],A:[s.a],J:[0],SEG:[s.segmentIndex+1]};
    }

    // Global sampling keeps the entire motion uniformly inspectable.
    for (let i=0; i<=n; i++) times.push(total * i / n);

    // Structural/adaptive samples guarantee that even very short non-zero
    // segments remain curved when zoomed, independent of their fraction of total time.
    const MIN_SEGMENT_SUBDIVISIONS = 12;
    for (const seg of profile.segments) {
      times.push(seg.t0, seg.t1);
      if (seg.duration > 0) {
        for (let k=1; k<MIN_SEGMENT_SUBDIVISIONS; k++) {
          times.push(seg.t0 + seg.duration*k/MIN_SEGMENT_SUBDIVISIONS);
        }
      }
    }

    times.sort((a,b) => a-b);
    const unique = [];
    for (const t of times) {
      // Exact duplicates occur naturally because one segment's t1 is the next t0.
      // Do not merge merely "nearby" structural times: tiny segments are meaningful.
      if (!unique.length || t !== unique[unique.length-1]) unique.push(t);
    }

    const T=[], X=[], V=[], A=[], J=[], SEG=[];
    for (const t of unique) {
      const s = evaluateAtTime(profile, t);
      T.push(s.t); X.push(s.x); V.push(s.v); A.push(s.a); J.push(s.j); SEG.push(s.segmentIndex+1);
    }
    return {T,X,V,A,J,SEG};
  }

  function calculatePeaks(profile) {
    let vMaxUsed = -Infinity, vMinUsed = Infinity;
    let aAbsPeak = 0, aMaxUsed = -Infinity, aMinUsed = Infinity;

    function consider(s) {
      if (s.v > vMaxUsed) vMaxUsed = s.v;
      if (s.v < vMinUsed) vMinUsed = s.v;
      if (s.a > aMaxUsed) aMaxUsed = s.a;
      if (s.a < aMinUsed) aMinUsed = s.a;
      const aa = Math.abs(s.a);
      if (aa > aAbsPeak) aAbsPeak = aa;
    }

    for (const seg of profile.segments) {
      consider(seg.start);
      consider(seg.end);

      // Velocity extrema can also occur inside a constant-jerk segment where a(t)=0.
      if (seg.jerk !== 0) {
        const tc = -seg.start.a / seg.jerk;
        if (tc > 0 && tc < seg.duration) consider(propagate(seg.start,seg.jerk,tc));
      }
    }

    return {
      vPeak:Number.isFinite(vMaxUsed) ? vMaxUsed : 0,
      vMin:Number.isFinite(vMinUsed) ? vMinUsed : 0,
      aAbsPeak,
      aMaxUsed:Number.isFinite(aMaxUsed) ? aMaxUsed : 0,
      aMinUsed:Number.isFinite(aMinUsed) ? aMinUsed : 0
    };
  }

  function validateProfile(profile, targetDistance) {
    const p=profile.params;
    const errors=[];
    const dTol=Math.max(distanceTol(targetDistance), 2*(profile.solverDistanceResolution||0));
    const vTol=scaledTol(p.vMax,p.v0,p.vf,profile.vPeak)*8;
    const aTol=scaledTol(p.aMax,p.dMax)*8;
    const jTol=scaledTol(p.j1,p.j2,p.j3,p.j4)*8;

    if (!Number.isFinite(profile.xTotal) || Math.abs(profile.xTotal-targetDistance)>dTol) {
      errors.push(`distance residual ${profile.xTotal-targetDistance} mm exceeds tolerance ${dTol} mm`);
    }
    if (!closeEnough(profile.vFinal,p.vf,vTol,128*EPS)) errors.push(`final velocity ${profile.vFinal} != Vf ${p.vf}`);
    if (!closeEnough(profile.aFinal,0,aTol,128*EPS)) errors.push(`final acceleration ${profile.aFinal} != 0`);
    if (profile.peaks.vMin < -vTol) errors.push(`negative velocity ${profile.peaks.vMin} mm/s`);
    if (profile.peaks.vPeak > p.vMax + vTol) errors.push(`velocity limit exceeded: ${profile.peaks.vPeak} > ${p.vMax}`);
    if (profile.peaks.aMaxUsed > p.aMax + aTol) errors.push(`acceleration limit exceeded: ${profile.peaks.aMaxUsed} > ${p.aMax}`);
    if (profile.peaks.aMinUsed < -p.dMax - aTol) errors.push(`deceleration limit exceeded: ${profile.peaks.aMinUsed} < ${-p.dMax}`);

    const expectedJ=[+p.j1,0,-p.j2,0,-p.j3,0,+p.j4];
    for (let i=0;i<profile.segments.length;i++) {
      const seg=profile.segments[i];
      if (!closeEnough(seg.jerk,expectedJ[i],jTol,128*EPS)) errors.push(`segment ${i+1} jerk mismatch`);
      if (i>0) {
        const prev=profile.segments[i-1];
        if (!closeEnough(prev.end.t,seg.start.t,scaledTol(profile.tTotal)*8,128*EPS) ||
            !closeEnough(prev.end.x,seg.start.x,dTol,128*EPS) ||
            !closeEnough(prev.end.v,seg.start.v,vTol,128*EPS) ||
            !closeEnough(prev.end.a,seg.start.a,aTol,128*EPS)) {
          errors.push(`state discontinuity between segments ${i} and ${i+1}`);
        }
      }
    }

    return {valid:errors.length===0,status:errors.length===0?'VALID':'INVALID',errors,distanceTolerance:dTol};
  }

  function solveExactProfile(S, p, sampleCount) {
    if (!Number.isFinite(S) || S<=0) throw appError('err.distancePositive');
    for (const k of ['vMax','aMax','dMax','j1','j2','j3','j4','v0','vf']) {
      if (!Number.isFinite(p[k])) throw appError('err.finite',{name:k});
    }
    if (!(p.vMax>0 && p.aMax>0 && p.dMax>0)) throw appError('err.corePositive');
    if ([p.j1,p.j2,p.j3,p.j4].some(j=>j<0)) throw appError('err.jerkNonNegative');
    if (p.v0<0 || p.vf<0) throw appError('err.boundaryNonNegative');

    const minPeak = Math.max(p.v0, p.vf);
    const tolVel = scaledTol(p.vMax,p.v0,p.vf)*8;
    if (p.vMax < minPeak - tolVel) {
      throw appError('err.vmaxBoundary');
    }

    const dMin = transitionDistance(minPeak, p);
    const dAtVmax = transitionDistance(p.vMax, p);
    const tolDist = distanceTol(S);

    if (S < dMin - tolDist) {
      throw appError('err.distanceTooShort',{distance:fmt(dMin,9)});
    }

    let vTarget = p.vMax;
    let Tv = 0;
    let modeKey='';

    if (dAtVmax < S - tolDist) {
      Tv = (S - dAtVmax) / p.vMax;
      modeKey='profile.vmaxCruise';
    } else if (Math.abs(dAtVmax - S) <= tolDist) {
      modeKey='profile.vmaxNoCruise';
    } else {
      let lo = minPeak;
      let hi = p.vMax;
      let exactMid = null;
      for (let it=0; it<80; it++) {
        const mid = 0.5*(lo+hi);
        if (mid===lo || mid===hi) break;
        const d = transitionDistance(mid, p);
        const residual = d-S;
        if (Math.abs(residual) <= tolDist*0.25) { exactMid=mid; break; }
        if (residual > 0) hi = mid; else lo = mid;
      }
      vTarget = exactMid ?? 0.5*(lo+hi);
      Tv = 0;
      modeKey='profile.reducedPeak';
    }

    const profile = buildExactModel(vTarget, Tv, p);
    profile.S = S;
    profile.modeKey=modeKey;
    profile.sampleCountRequested = clamp(Math.round(sampleCount), 200, 5000);
    profile.peaks = calculatePeaks(profile);
    profile.distanceError = profile.xTotal - S;

    // In reduced-peak solutions, the distance-vs-velocity mapping can be very
    // ill-conditioned. Estimate the smallest representable distance change caused
    // by one floating-point velocity step and include it in the validation tolerance.
    profile.solverDistanceResolution=0;
    if (modeKey==='profile.reducedPeak') {
      const dv=EPS*Math.max(1,Math.abs(vTarget));
      const vLo=Math.max(minPeak,vTarget-dv);
      const vHi=Math.min(p.vMax,vTarget+dv);
      const d0=profile.xTotal;
      const dLo=transitionDistance(vLo,p);
      const dHi=transitionDistance(vHi,p);
      profile.solverDistanceResolution=Math.max(Math.abs(d0-dLo),Math.abs(dHi-d0));
    }

    profile.validation = validateProfile(profile,S);
    if (!profile.validation.valid) {
      throw appError('err.validation',{detail:profile.validation.errors.join('; ')});
    }
    profile.sample = sampleProfile(profile, profile.sampleCountRequested);
    return profile;
  }

  // ---------------------------------------------------------------------------
  // Gráficas
  // ---------------------------------------------------------------------------
  const chartDefs = [
    {id:'chartX', key:'X', stateKey:'x', unit:'mm', color:'#79c0ff', step:false},
    {id:'chartV', key:'V', stateKey:'v', unit:'mm/s', color:'#2ecc71', step:false},
    {id:'chartA', key:'A', stateKey:'a', unit:'mm/s²', color:'#f1c40f', step:false},
    {id:'chartJ', key:'J', stateKey:'j', unit:'mm/s³', color:'#e74c3c', step:true}
  ];

  const view = {tMin:0, tMax:null, cursor:null, dragging:false, dragCanvas:null, dragX:0, dragMin:0, dragMax:0};

  function mergedReferenceLines(profile, key) {
    if (!profile) return [];
    const p = profile.params;
    let raw = [];
    if (key === 'X') raw = [{value:profile.S, label:'S target'}];
    if (key === 'V') raw = [{value:p.vMax, label:'Vmax'}];
    if (key === 'A') raw = [{value:p.aMax, label:'+Amax'}, {value:-p.dMax, label:'−Dmax'}];
    if (key === 'J') raw = [
      {value:+p.j1,label:'+J1'}, {value:-p.j2,label:'−J2'},
      {value:-p.j3,label:'−J3'}, {value:+p.j4,label:'+J4'}
    ];

    const out = [];
    const tol = 1e-10;
    for (const r of raw) {
      const existing = out.find(x => Math.abs(x.value-r.value) <= tol*Math.max(1,Math.abs(r.value)));
      if (existing) existing.label += '/' + r.label;
      else out.push({...r});
    }
    return out;
  }

  function getViewRange(profile) {
    if (!profile) return {min:0,max:1};
    const total = Math.max(profile.tTotal, 1e-9);
    if (view.tMax == null) return {min:0,max:total};
    const span = clamp(view.tMax-view.tMin, Math.max(total*1e-6,1e-9), total);
    const min = clamp(view.tMin, 0, Math.max(0,total-span));
    return {min, max:min+span};
  }

  function dataRangeForView(sample, key, tMin, tMax) {
    if (!sample || !sample.T.length) return {min:0,max:0,found:false,i0:0,i1:0};
    const i0 = Math.max(0, lowerBound(sample.T, tMin)-1);
    const i1 = Math.min(sample.T.length, upperBound(sample.T, tMax)+1);
    const mm = safeMinMax(sample[key], i0, i1);
    return {...mm, i0, i1};
  }

  function drawPolyline(ctx, sample, key, geom, color, dashed, stepMode) {
    const {padL,padT,w,h,tMin,tMax,yMin,yMax} = geom;
    if (!sample || sample.T.length < 2) return;
    const range = dataRangeForView(sample,key,tMin,tMax);
    if (range.i1-range.i0 < 1) return;
    const tSpan = tMax-tMin;
    const ySpan = yMax-yMin;
    const xPx = t => padL + ((t-tMin)/tSpan)*w;
    const yPx = y => padT + (1-(y-yMin)/ySpan)*h;

    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = dashed ? 1.4 : 2;
    ctx.globalAlpha = dashed ? .62 : 1;
    ctx.setLineDash(dashed ? [7,5] : []);
    ctx.beginPath();

    let started = false;
    let prevX=0, prevY=0;
    for (let i=range.i0; i<range.i1; i++) {
      const t = sample.T[i];
      const y = sample[key][i];
      if (!Number.isFinite(t) || !Number.isFinite(y)) continue;
      const x = xPx(t), py = yPx(y);
      if (!started) {
        ctx.moveTo(x,py);
        started = true;
      } else if (stepMode) {
        ctx.lineTo(x,prevY);
        ctx.lineTo(x,py);
      } else {
        ctx.lineTo(x,py);
      }
      prevX=x; prevY=py;
    }
    if (started) ctx.stroke();
    ctx.restore();
  }

  function drawAccelerationProfile(ctx, profile, geom, color, dashed) {
    if (!profile) return;
    const {padL,padT,w,h,tMin,tMax,yMin,yMax}=geom;
    const xPx=t=>padL+((t-tMin)/(tMax-tMin))*w;
    const yPx=y=>padT+(1-(y-yMin)/(yMax-yMin))*h;
    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=dashed?1.4:2; ctx.globalAlpha=dashed?.62:1; ctx.setLineDash(dashed?[7,5]:[]);
    for (const seg of profile.segments) {
      if (seg.instantaneous && seg.t0>=tMin && seg.t0<=tMax && seg.start.a!==seg.end.a) line(ctx,xPx(seg.t0),yPx(seg.start.a),xPx(seg.t0),yPx(seg.end.a));
      if (seg.duration>0) {
        const a=Math.max(seg.t0,tMin), b=Math.min(seg.t1,tMax);
        if (b>=a) {
          const sa=propagate(seg.start,seg.jerk,a-seg.t0), sb=propagate(seg.start,seg.jerk,b-seg.t0);
          line(ctx,xPx(a),yPx(sa.a),xPx(b),yPx(sb.a));
        }
      }
    }
    ctx.restore();
  }

  function drawJerkProfile(ctx, profile, geom, color, dashed) {
    if (!profile) return;
    const {padL,padT,w,h,tMin,tMax,yMin,yMax}=geom;
    const xPx=t=>padL+((t-tMin)/(tMax-tMin))*w;
    const yPx=y=>padT+(1-(y-yMin)/(yMax-yMin))*h;
    ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=dashed?1.4:2; ctx.globalAlpha=dashed?.62:1; ctx.setLineDash(dashed?[7,5]:[]);
    let previousActive=null;
    for (const seg of profile.segments) {
      if (seg.duration>0) {
        if (previousActive && seg.t0>=tMin && seg.t0<=tMax && previousActive.t1===seg.t0 && previousActive.jerk!==seg.jerk) line(ctx,xPx(seg.t0),yPx(previousActive.jerk),xPx(seg.t0),yPx(seg.jerk));
        const a=Math.max(seg.t0,tMin),b=Math.min(seg.t1,tMax); if (b>=a) line(ctx,xPx(a),yPx(seg.jerk),xPx(b),yPx(seg.jerk));
        previousActive=seg;
      }
      if (seg.instantaneous && seg.t0>=tMin && seg.t0<=tMax) {
        const x=xPx(seg.t0), y0=yPx(0), top=padT+12, bottom=padT+h-12, yt=seg.impulseSign>0?top:bottom;
        ctx.setLineDash([]); line(ctx,x,y0,x,yt);
        ctx.beginPath();
        if (seg.impulseSign>0) {ctx.moveTo(x,top-1);ctx.lineTo(x-4,top+7);ctx.lineTo(x+4,top+7);} else {ctx.moveTo(x,bottom+1);ctx.lineTo(x-4,bottom-7);ctx.lineTo(x+4,bottom-7);} ctx.closePath();ctx.fill();
        ctx.font='bold 11px system-ui'; ctx.fillText(seg.impulseSign>0?'+∞':'−∞',x+5,seg.impulseSign>0?top+10:bottom-4);
        ctx.setLineDash(dashed?[7,5]:[]);
      }
    }
    ctx.restore();
  }

  function drawSeries(def) {
    const canvas = byId(def.id);
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(canvas.clientWidth*dpr));
    canvas.height = Math.max(1, Math.round(canvas.clientHeight*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const W = canvas.clientWidth;
    const H = canvas.clientHeight;
    ctx.fillStyle=cssVar('--surface');
    ctx.fillRect(0,0,W,H);

    const profile = window.__lastProfile || null;
    if (!profile || !profile.sample || profile.sample.T.length < 2) {
      ctx.fillStyle=cssVar('--text-muted');
      ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto';
      ctx.fillText(tr('chart.noProfile'),48,32);
      canvas.__plotGeom = null;
      return;
    }

    const compareProfile = (byId('chkCompare').checked ? window.__previousProfile : null);
    const range = getViewRange(profile);
    const tMin = range.min, tMax = range.max;
    const padL=58, padR=16, padT=30, padB=30;
    const w = Math.max(1,W-padL-padR), h=Math.max(1,H-padT-padB);

    const cur = dataRangeForView(profile.sample, def.key, tMin, tMax);
    let yMin = cur.found ? cur.min : 0;
    let yMax = cur.found ? cur.max : 0;

    if (compareProfile && compareProfile.sample) {
      const cmp = dataRangeForView(compareProfile.sample, def.key, tMin, Math.min(tMax,compareProfile.tTotal));
      if (cmp.found) {
        if (cmp.min < yMin) yMin = cmp.min;
        if (cmp.max > yMax) yMax = cmp.max;
      }
    }

    const refs = mergedReferenceLines(profile,def.key);
    for (const r of refs) {
      if (r.value < yMin) yMin = r.value;
      if (r.value > yMax) yMax = r.value;
    }
    if (0 < yMin) yMin = 0;
    if (0 > yMax) yMax = 0;
    if (Math.abs(yMax-yMin) < 1e-12) { yMin -= 1; yMax += 1; }
    const yPad = (yMax-yMin)*0.08;
    yMin -= yPad; yMax += yPad;

    const geom = {padL,padR,padT,padB,w,h,tMin,tMax,yMin,yMax};
    canvas.__plotGeom = geom;
    const xPx = t => padL + ((t-tMin)/(tMax-tMin))*w;
    const yPx = y => padT + (1-(y-yMin)/(yMax-yMin))*h;

    // Grid and axes.
    ctx.strokeStyle=cssVar('--shadow-dark');
    ctx.lineWidth = 1;
    const gridX=6, gridY=4;
    for (let i=0;i<=gridX;i++) line(ctx,padL+w*i/gridX,padT,padL+w*i/gridX,padT+h);
    for (let i=0;i<=gridY;i++) line(ctx,padL,padT+h*i/gridY,padL+w,padT+h*i/gridY);

    ctx.fillStyle=cssVar('--text-muted');
    ctx.font = '11px system-ui, -apple-system, Segoe UI, Roboto';
    for (let i=0;i<=gridX;i++) {
      const tt=tMin+(tMax-tMin)*i/gridX;
      ctx.fillText(fmt(tt,3), padL+w*i/gridX-12, padT+h+19);
    }
    for (let i=0;i<=gridY;i++) {
      const yy=yMax-(yMax-yMin)*i/gridY;
      ctx.fillText(fmt(yy,2), 5, padT+h*i/gridY+4);
    }

    // Configured physical limit lines.
    ctx.save();
    ctx.setLineDash([4,4]);
    ctx.lineWidth=1;
    ctx.strokeStyle=cssVar('--text-muted');
    ctx.fillStyle=cssVar('--text-muted');
    ctx.font='10px system-ui, -apple-system, Segoe UI, Roboto';
    for (const r of refs) {
      if (r.value < yMin || r.value > yMax) continue;
      const py=yPx(r.value);
      line(ctx,padL,py,padL+w,py);
      ctx.fillText(`${r.label}: ${fmt(r.value,2)}`, padL+5, clamp(py-4,padT+10,padT+h-3));
    }
    ctx.restore();

    // Seven segment boundaries + labels.
    ctx.save();
    ctx.strokeStyle=cssVar('--accent-dark');
    ctx.fillStyle=cssVar('--text-muted');
    ctx.font='9px system-ui, -apple-system, Segoe UI, Roboto';
    ctx.lineWidth=1;
    ctx.setLineDash([2,4]);
    for (const seg of profile.segments) {
      if (seg.t1 > tMin+EPS && seg.t1 < tMax-EPS) line(ctx,xPx(seg.t1),padT,xPx(seg.t1),padT+h);
      if (seg.duration > EPS) {
        const mid=0.5*(seg.t0+seg.t1);
        if (mid>=tMin && mid<=tMax) {
          const px=xPx(mid);
          const pxDur=(seg.duration/(tMax-tMin))*w;
          if (pxDur>34) ctx.fillText(tr(seg.shortKey),px-12,13);
        }
      }
    }
    ctx.restore();

    // Previous run first, then current run. Jerk is rendered directly from
    // analytical segments so discontinuities are exact and never interpolated.
    if (def.key==='J') {
      if (compareProfile) drawJerkProfile(ctx,compareProfile,geom,cssVar('--text-muted'),true);
      drawJerkProfile(ctx,profile,geom,def.color,false);
    } else if (def.key==='A') {
      if (compareProfile) drawAccelerationProfile(ctx,compareProfile,geom,cssVar('--text-muted'),true);
      drawAccelerationProfile(ctx,profile,geom,def.color,false);
    } else {
      if (compareProfile && compareProfile.sample) drawPolyline(ctx,compareProfile.sample,def.key,geom,cssVar('--text-muted'),true,false);
      drawPolyline(ctx,profile.sample,def.key,geom,def.color,false,false);
    }

    // Visible current min/max badges, computed with loops (no spread operator).
    if (cur.found) {
      ctx.fillStyle=cssVar('--text-muted');
      ctx.font='10px system-ui, -apple-system, Segoe UI, Roboto';
      ctx.textAlign='right';
      ctx.fillText(`${tr('chart.max')} ${fmt(cur.max,3)} ${def.unit}`,W-18,H-17);
      ctx.fillText(`${tr('chart.min')} ${fmt(cur.min,3)} ${def.unit}`,W-18,H-5);
      ctx.textAlign='left';
    }

    // Synchronized exact cursor / tooltip.
    if (view.cursor != null && view.cursor>=tMin && view.cursor<=tMax) {
      const state=evaluateAtTime(profile,view.cursor);
      const val=state[def.stateKey];
      const cx=xPx(view.cursor), cy=yPx(val);
      ctx.save();
      ctx.strokeStyle=cssVar('--text');
      ctx.globalAlpha=.65;
      ctx.setLineDash([3,3]);
      line(ctx,cx,padT,cx,padT+h);
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(cx,cy,3.5,0,Math.PI*2); ctx.fillStyle=def.color; ctx.fill();

      const text1=`t ${fmt(state.t,6)} s`;
      const text2=`${def.key.toLowerCase()} ${fmt(val,6)} ${def.unit}`;
      const text3=tr(state.segmentKey || 'segment.end');
      ctx.font='11px system-ui, -apple-system, Segoe UI, Roboto';
      const boxW=Math.max(ctx.measureText(text1).width,ctx.measureText(text2).width,ctx.measureText(text3).width)+16;
      const boxH=50;
      let bx=cx+8;
      if (bx+boxW>W-5) bx=cx-boxW-8;
      bx=clamp(bx,padL+2,W-boxW-4);
      const by=padT+5;
      ctx.fillStyle=cssVar('--surface');
      ctx.strokeStyle=cssVar('--accent-dark');
      ctx.fillRect(bx,by,boxW,boxH);
      ctx.strokeRect(bx,by,boxW,boxH);
      ctx.fillStyle=cssVar('--text');
      ctx.fillText(text1,bx+8,by+14);
      ctx.fillText(text2,bx+8,by+29);
      ctx.fillStyle=cssVar('--text-muted');
      ctx.fillText(text3,bx+8,by+44);
      ctx.restore();
    }
  }

  function redrawCharts() { for (const def of chartDefs) drawSeries(def); }

  let redrawPending=false;
  function requestChartRedraw() {
    if (redrawPending) return;
    redrawPending=true;
    requestAnimationFrame(() => { redrawPending=false; redrawCharts(); });
  }

  function resetZoom() {
    view.tMin=0; view.tMax=null; view.cursor=null;
    redrawCharts();
  }

  function attachChartInteractions(canvas) {
    canvas.addEventListener('mousemove', e => {
      const g=canvas.__plotGeom;
      const profile=window.__lastProfile;
      if (!g || !profile) return;
      const rect=canvas.getBoundingClientRect();
      const x=e.clientX-rect.left;

      if (view.dragging && view.dragCanvas===canvas) {
        const dx=x-view.dragX;
        const span=view.dragMax-view.dragMin;
        const dt=-dx/g.w*span;
        const total=profile.tTotal;
        let nmin=view.dragMin+dt;
        nmin=clamp(nmin,0,Math.max(0,total-span));
        view.tMin=nmin; view.tMax=nmin+span;
        view.cursor=null;
        requestChartRedraw();
        return;
      }

      if (x>=g.padL && x<=g.padL+g.w) {
        view.cursor=g.tMin+((x-g.padL)/g.w)*(g.tMax-g.tMin);
        requestChartRedraw();
      }
    });

    canvas.addEventListener('mouseleave', () => {
      if (!view.dragging) { view.cursor=null; requestChartRedraw(); }
    });

    canvas.addEventListener('mousedown', e => {
      if (e.button!==0 || !canvas.__plotGeom || !window.__lastProfile) return;
      const rect=canvas.getBoundingClientRect();
      view.dragging=true; view.dragCanvas=canvas; view.dragX=e.clientX-rect.left;
      const r=getViewRange(window.__lastProfile);
      view.dragMin=r.min; view.dragMax=r.max;
      canvas.style.cursor='grabbing';
      e.preventDefault();
    });

    canvas.addEventListener('wheel', e => {
      const g=canvas.__plotGeom;
      const profile=window.__lastProfile;
      if (!g || !profile) return;
      e.preventDefault();
      const rect=canvas.getBoundingClientRect();
      const x=clamp(e.clientX-rect.left,g.padL,g.padL+g.w);
      const anchor=g.tMin+((x-g.padL)/g.w)*(g.tMax-g.tMin);
      const currentSpan=g.tMax-g.tMin;
      const factor=e.deltaY>0 ? 1.22 : 1/1.22;
      const total=profile.tTotal;
      const minSpan=Math.max(total*1e-5,1e-7);
      const newSpan=clamp(currentSpan*factor,minSpan,total);
      const frac=currentSpan>0 ? (anchor-g.tMin)/currentSpan : .5;
      let nmin=anchor-frac*newSpan;
      nmin=clamp(nmin,0,Math.max(0,total-newSpan));
      view.tMin=nmin; view.tMax=nmin+newSpan;
      view.cursor=anchor;
      requestChartRedraw();
    }, {passive:false});

    canvas.addEventListener('dblclick', resetZoom);
  }

  window.addEventListener('mouseup', () => {
    if (view.dragging && view.dragCanvas) view.dragCanvas.style.cursor='default';
    view.dragging=false; view.dragCanvas=null;
  });

  // ---------------------------------------------------------------------------
  // Métricas de interfaz y CSV
  // ---------------------------------------------------------------------------
  function kv(k,v) { return `<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

  function updateJerkGraphNote() {
    const p=window.__lastProfile; const hasImpulse=!!(p && p.segments.some(s=>s.instantaneous));
    byId('jerkGraphNote').hidden=!hasImpulse;
  }

  function showMetrics(p) {
    byId('metrics').innerHTML=
      kv(tr('metric.validation'),p.validation&&p.validation.valid?tr('status.valid'):tr('status.invalid'))+
      kv(tr('metric.profileMode'),tr(p.modeKey))+
      kv(tr('metric.motionModel'),tr(p.modelKey))+
      kv(tr('metric.jerkMode'),tr(p.params&&p.params.jerkMode==='independent'?'jerkMode.independent':'jerkMode.single'))+
      kv(tr('metric.totalTime'),fmt(p.tTotal,2)+' s')+
      kv(tr('metric.accelPhase'),fmt(p.segments[0].duration+p.segments[1].duration+p.segments[2].duration,2)+' s')+
      kv(tr('metric.decelPhase'),fmt(p.segments[4].duration+p.segments[5].duration+p.segments[6].duration,2)+' s')+
      kv(tr('metric.distance'),fmt(p.xTotal,2)+' mm')+
      kv(tr('metric.peakVelocity'),fmt(p.peaks.vPeak,2)+' mm/s')+kv(tr('metric.peakAccel'),fmt(p.peaks.aAbsPeak,2)+' mm/s²')+
      kv(tr('metric.cruise'),fmt(p.Tv,2)+' s')+kv(tr('metric.finalVelocity'),fmt(p.vFinal,2)+' mm/s')+
      kv(tr('metric.distanceError'),fmt(p.distanceError,2)+' mm')+kv(tr('metric.points'),String(p.sample.T.length));
    byId('segmentSummary').innerHTML=p.segments.map(seg=>{
      const detail=seg.instantaneous?tr('segment.impulse',{sign:seg.impulseSign>0?'+':'−'}):tr('segment.detail',{time:fmt(seg.duration,2),jerk:fmt(seg.jerk,2)});
      return `<div class="segment-chip"><div class="n">${tr(seg.nameKey)}</div><div class="d">${detail}</div></div>`;
    }).join('');
    updateJerkGraphNote();
  }

  function csvNumber(value) {
    return Number.isFinite(value) ? Number(value).toPrecision(17) : '';
  }

  function toCSV(profile) {
    const s=profile.sample;
    const p=profile.params;
    const rows=[
      `# ${APP_CONFIG.name},${APP_CONFIG.version}`,
      `# motion_model,${profile.modelKey}`,
      `# jerk_zero_convention,${tr('csv.zeroConvention').replace(/,/g,';')}`, 
      `# validation,${profile.validation ? profile.validation.status : 'UNKNOWN'}`,
      `# profile_mode,${profile.modeKey}`, 
      `# jerk_mode,${p.jerkMode || 'single'}`,
      `# distance_target_mm,${csvNumber(profile.S)}`,
      `# v0_mm_s,${csvNumber(p.v0)}`,
      `# vf_mm_s,${csvNumber(p.vf)}`,
      `# vmax_mm_s,${csvNumber(p.vMax)}`,
      `# amax_mm_s2,${csvNumber(p.aMax)}`,
      `# dmax_mm_s2,${csvNumber(p.dMax)}`,
      `# j1_mm_s3,${csvNumber(p.j1)}`,
      `# j2_mm_s3,${csvNumber(p.j2)}`,
      `# j3_mm_s3,${csvNumber(p.j3)}`,
      `# j4_mm_s3,${csvNumber(p.j4)}`,
      `# total_time_s,${csvNumber(profile.tTotal)}`,
      `# acceleration_phase_time_s,${csvNumber(profile.segments[0].duration+profile.segments[1].duration+profile.segments[2].duration)}`,
      `# deceleration_phase_time_s,${csvNumber(profile.segments[4].duration+profile.segments[5].duration+profile.segments[6].duration)}`,
      `# cruise_time_s,${csvNumber(profile.Tv)}`,
      `# distance_error_mm,${csvNumber(profile.distanceError)}`
    ];
    for (const seg of profile.segments) { rows.push(`# segment_${seg.index+1}_duration_s,${csvNumber(seg.duration)}`); if(seg.instantaneous) rows.push(`# impulse_${seg.index+1}_time_s,${csvNumber(seg.t0)},delta_a_mm_s2,${csvNumber(seg.deltaA)},ideal_jerk,${seg.impulseSign>0?'+Infinity':'-Infinity'}`); }
    rows.push('');
    rows.push('t[s],x[mm],v[mm/s],a[mm/s^2],j[mm/s^3],segment');
    for (let i=0;i<s.T.length;i++) {
      rows.push(`${csvNumber(s.T[i])},${csvNumber(s.X[i])},${csvNumber(s.V[i])},${csvNumber(s.A[i])},${csvNumber(s.J[i])},${s.SEG[i]}`);
    }
    return rows.join('\n')+'\n';
  }

  function getJerkMode() {
    return byId('jerkModeIndependent').checked ? 'independent' : 'single';
  }

  function copySingleJerkToIndependent() {
    const value=byId('inJmax').value;
    byId('inJ1').value=value;
    byId('inJ2').value=value;
    byId('inJ3').value=value;
    byId('inJ4').value=value;
  }

  function updateJerkModeUI(syncValues=true) {
    const mode=getJerkMode();
    const isSingle=mode==='single';
    byId('singleJerkPanel').hidden=!isSingle;
    byId('independentJerkPanel').hidden=isSingle;
    if (isSingle && syncValues) copySingleJerkToIndependent();
  }

  function readInputs() {
    const jerkMode=getJerkMode();
    const jMax=Number(byId('inJmax').value);
    if (jerkMode==='single') copySingleJerkToIndependent();

    const values={
      S:Number(byId('inDist').value),
      vMax:Number(byId('inVmax').value),
      aMax:Number(byId('inAmax').value),
      dMax:Number(byId('inDmax').value),
      j1:jerkMode==='single' ? jMax : Number(byId('inJ1').value),
      j2:jerkMode==='single' ? jMax : Number(byId('inJ2').value),
      j3:jerkMode==='single' ? jMax : Number(byId('inJ3').value),
      j4:jerkMode==='single' ? jMax : Number(byId('inJ4').value),
      jerkMode,
      v0:Number(byId('inV0').value),
      vf:Number(byId('inVf').value),
      samples:Number(byId('inSamples').value)
    };

    const positive=['vMax','aMax','dMax'];
    if (!Number.isFinite(values.S)||values.S<=0) throw appError('err.distancePositive');
    if (values.vMax<Math.max(values.v0,values.vf)-scaledTol(values.vMax,values.v0,values.vf)*8) throw appError('err.vmaxBoundary');
    for (const k of positive) {
      if (!Number.isFinite(values[k])||values[k]<=0) throw appError('err.corePositive');
    }
    for (const k of ['j1','j2','j3','j4']) { if (!Number.isFinite(values[k])||values[k]<0) throw appError('err.jerkNonNegative'); }
    if (!Number.isFinite(values.v0) || values.v0<0 || !Number.isFinite(values.vf) || values.vf<0) {
      throw appError('err.boundaryNonNegative');
    }
    if (!Number.isFinite(values.samples)) values.samples=1200;
    values.samples=clamp(Math.round(values.samples),200,5000);
    byId('inSamples').value=values.samples;
    return values;
  }

  async function run() {
    messageState=null; renderMessage();
    setSpinner(true);
    await Promise.resolve(); // Permite que el navegador pinte el indicador antes del cálculo síncrono.
    try {
      const u=readInputs();
      const p={
        vMax:u.vMax,aMax:u.aMax,dMax:u.dMax,
        j1:u.j1,j2:u.j2,j3:u.j3,j4:u.j4,
        jerkMode:u.jerkMode,
        v0:u.v0,vf:u.vf
      };
      const next=solveExactProfile(u.S,p,u.samples);

      // Conserva la corrida anterior antes de sustituir el perfil activo.
      window.__previousProfile=window.__lastProfile || null;
      window.__lastProfile=next;

      showMetrics(next);
      resetZoom();
      syncAnimationWithProfile();

      const previous=window.__previousProfile?tr('msg.previousAvailable'):'';
      setMessage('msg.success',{points:next.sample.T.length,error:fmt(Math.abs(next.distanceError),2),previous},'ok');
      return next;
    } catch (err) {
      console.error(err);
      setMessage('msg.error',{detail:err.message},'err');
      return null;
    } finally {
      setSpinner(false);
    }
  }

  function clearAllState() {
    window.__lastProfile=null;
    window.__previousProfile=null;
    byId('chkCompare').checked=false;
    view.tMin=0; view.tMax=null; view.cursor=null;
    anim.profile=null;
    stopAnimation();
  }

  function resetUI() {
    byId('inDist').value=2000;
    byId('inVmax').value=500;
    byId('inAmax').value=300;
    byId('inDmax').value=300;
    byId('inJmax').value=500;
    byId('jerkModeSingle').checked=true;
    byId('jerkModeIndependent').checked=false;
    byId('inJ1').value=500;
    byId('inJ2').value=500;
    byId('inJ3').value=500;
    byId('inJ4').value=500;
    updateJerkModeUI(true);
    byId('inV0').value=0;
    byId('inVf').value=0;
    byId('inSamples').value=1000;
    byId('metrics').innerHTML='';
    byId('segmentSummary').innerHTML='';
    byId('boundaryDetails').open=false;
    clearAllState();
    setMessage('msg.reset',{},'');
    redrawCharts();
    resizeMotion();
  }

  // ---------------------------------------------------------------------------
  // Animación exacta
  // ---------------------------------------------------------------------------
  const motionCanvas=byId('motionCanvas');
  const btnToggle=byId('btnToggle');
  const anim={running:false,t:0,speed:1,profile:null,rafId:null,anchorReal:null,anchorT:0,lastFrameReal:null};

  function drawMotion(state) {
    const ctx=motionCanvas.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    motionCanvas.width=Math.max(1,Math.round(motionCanvas.clientWidth*dpr));
    motionCanvas.height=Math.max(1,Math.round(motionCanvas.clientHeight*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const W=motionCanvas.clientWidth,H=motionCanvas.clientHeight;
    ctx.fillStyle=cssVar('--surface');ctx.fillRect(0,0,W,H);
    const padL=48,padR=16,padT=18,padB=28;
    const y=Math.round((padT+(H-padB))/2),x0=padL,x1=W-padR;
    ctx.strokeStyle=cssVar('--shadow-dark');ctx.lineWidth=3;line(ctx,x0,y,x1,y);

    const profile=anim.profile;
    const S=profile ? profile.S : 0;
    const st=state || {t:0,x:0,v:0};
    ctx.fillStyle=cssVar('--text-muted');ctx.font='12px system-ui, -apple-system, Segoe UI, Roboto';
    ctx.fillText('0 mm',x0-10,y+17);
    ctx.fillText(`${fmt(S,0)} mm`,Math.max(x0,x1-54),y+17);
    ctx.fillText(`t=${fmt(st.t,3)} s · x=${fmt(st.x,3)} mm · v=${fmt(st.v,3)} mm/s`,padL,14);

    const frac=S>0 ? clamp(st.x/S,0,1) : 0;
    const cx=x0+frac*(x1-x0);
    ctx.beginPath();ctx.arc(cx,y,10,0,Math.PI*2);ctx.fillStyle=cssVar('--accent');ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle=cssVar('--accent-dark');ctx.stroke();
  }

  function updateAnimationReadout(state) {
    const s=state||{t:0,x:0,v:0};
    byId('anim_t').textContent=fmt(s.t,3)+' s';
    byId('anim_x').textContent=fmt(s.x,3)+' mm';
    byId('anim_v').textContent=fmt(s.v,3)+' mm/s';
  }

  function animationStep(now) {
    if (!anim.running) return;
    const p=anim.profile;
    if (!p) { anim.running=false; updateToggleLabel(); return; }

    if (anim.anchorReal==null) {
      anim.anchorReal=now;
      anim.anchorT=anim.t;
      anim.lastFrameReal=now;
    }

    // Si el renderizado se suspende por una pestaña en segundo plano o una pausa larga,
    // conserva el cabezal visual actual para evitar saltos grandes al regresar.
    if (anim.lastFrameReal!=null && now-anim.lastFrameReal>250) {
      anim.anchorReal=now;
      anim.anchorT=anim.t;
    }
    anim.lastFrameReal=now;

    anim.t=Math.min(anim.anchorT+(now-anim.anchorReal)/1000*anim.speed,p.tTotal);
    const st=evaluateAtTime(p,anim.t);
    drawMotion(st); updateAnimationReadout(st);

    if (anim.t>=p.tTotal) {
      if (byId('chkRepeat').checked) {
        anim.t=0;
        anim.anchorT=0;
        anim.anchorReal=now;
        anim.lastFrameReal=now;
      } else {
        anim.running=false;anim.rafId=null;updateToggleLabel();return;
      }
    }
    anim.rafId=requestAnimationFrame(animationStep);
  }

  async function playAnimation() {
    if (!window.__lastProfile) {
      const result=await run();
      if (!result) return;
    }
    anim.profile=window.__lastProfile;
    if (anim.t>=anim.profile.tTotal) anim.t=0;
    if (!anim.running) {
      anim.running=true;
      anim.anchorT=anim.t;
      anim.anchorReal=performance.now();
      anim.lastFrameReal=anim.anchorReal;
      anim.rafId=requestAnimationFrame(animationStep);
    }
  }

  function pauseAnimation() {
    anim.running=false;
    if (anim.rafId!=null) cancelAnimationFrame(anim.rafId);
    anim.rafId=null;
    anim.anchorReal=null;
    anim.lastFrameReal=null;
  }

  function stopAnimation() {
    pauseAnimation();
    anim.t=0;
    anim.anchorT=0;
    const st=anim.profile ? evaluateAtTime(anim.profile,0) : {t:0,x:0,v:0};
    drawMotion(st);updateAnimationReadout(st);updateToggleLabel();
  }

  function syncAnimationWithProfile() {
    pauseAnimation();
    anim.profile=window.__lastProfile;
    anim.t=0;
    const st=anim.profile ? evaluateAtTime(anim.profile,0) : {t:0,x:0,v:0};
    drawMotion(st);updateAnimationReadout(st);updateToggleLabel();
  }

  function resizeMotion() {
    const st=anim.profile ? evaluateAtTime(anim.profile,anim.t) : {t:0,x:0,v:0};
    drawMotion(st);updateAnimationReadout(st);
  }

  function updateToggleLabel(){btnToggle.textContent=tr(anim.running?'btn.pause':'btn.play');}

  // ---------------------------------------------------------------------------
  // Eventos de interfaz
  // ---------------------------------------------------------------------------
  // ---------------------------------------------------------------------------
  for (const def of chartDefs) attachChartInteractions(byId(def.id));

  byId('jerkModeSingle').addEventListener('change',() => updateJerkModeUI(true));
  byId('jerkModeIndependent').addEventListener('change',() => updateJerkModeUI(false));
  byId('inJmax').addEventListener('input',() => {
    if (getJerkMode()==='single') copySingleJerkToIndependent();
  });

  byId('btnRun').addEventListener('click',run);
  byId('btnReset').addEventListener('click',async()=>{resetUI();await run();});
  byId('btnResetZoom').addEventListener('click',resetZoom);
  byId('btnPrintPDF').addEventListener('click',()=>window.print());
  byId('chkCompare').addEventListener('change',redrawCharts);
  byId('btnClearCompare').addEventListener('click',() => {
    window.__previousProfile=null;
    byId('chkCompare').checked=false;
    redrawCharts();
    setMessage(window.__lastProfile?'msg.previousCleared':'msg.noStored',{},'');
  });

  byId('btnCSV').addEventListener('click',() => {
    const p=window.__lastProfile;
    if (!p) { setMessage('msg.exportFirst',{},'warn'); return; }
    const blob=new Blob([toCSV(p)],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='JerkSimulator_profile.csv';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),0);
  });

  btnToggle.addEventListener('click',async() => {
    if (anim.running) pauseAnimation(); else await playAnimation();
    updateToggleLabel();
  });
  byId('btnStop').addEventListener('click',stopAnimation);
  byId('speed').addEventListener('input',e => {
    const now=performance.now();
    if (anim.running && anim.anchorReal!=null) {
      anim.t=Math.min(anim.anchorT+(now-anim.anchorReal)/1000*anim.speed,anim.profile.tTotal);
      anim.anchorT=anim.t;
      anim.anchorReal=now;
      anim.lastFrameReal=now;
    }
    anim.speed=parseFloat(e.target.value)||1;
    byId('speedVal').textContent=fmt(anim.speed,2);
  });

  document.addEventListener('visibilitychange',() => {
    if (!document.hidden && anim.running) {
      const now=performance.now();
      anim.anchorT=anim.t; anim.anchorReal=now; anim.lastFrameReal=now;
    }
  });

  window.addEventListener('resize',() => { requestChartRedraw(); resizeMotion(); });

  byId('languageSelect').addEventListener('change',e=>setLanguage(e.target.value,true));
  byId('themeSelect').addEventListener('change',e=>setTheme(e.target.value,true));

  const dlg=byId('aboutDialog'), licenseDlg=byId('licenseDialog');
  byId('btnAboutCard').addEventListener('click',()=>{updateAbout();dlg.showModal();});
  byId('aboutClose').addEventListener('click',()=>dlg.close());
  byId('btnViewLicense').addEventListener('click',()=>{byId('licenseText').textContent=byId('gpl3-full-license').textContent.trim();dlg.close();licenseDlg.showModal();});
  byId('licenseClose').addEventListener('click',()=>licenseDlg.close());
  for (const modal of [dlg,licenseDlg]) modal.addEventListener('click',e=>{const r=modal.getBoundingClientRect();if(!(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom))modal.close();});

  // Hooks públicos para pruebas de regresión del núcleo.
  // Public test hooks kept intentionally small; useful for browser console regression tests.
  window.JerkSimulatorCore={
    propagate,accelTiming,decelTiming,buildExactModel,transitionDistance,
    evaluateAtTime,sampleProfile,calculatePeaks,validateProfile,solveExactProfile,toCSV,csvNumber,
    scaledTol,distanceTol,closeEnough,
    getJerkMode,copySingleJerkToIndependent,updateJerkModeUI,readInputs
  };

  // Estado inicial y preferencias persistentes.
  window.__lastProfile=null;
  window.__previousProfile=null;
  currentLang=Object.prototype.hasOwnProperty.call(I18N,safeStorageGet('JerkSimulator.language'))?safeStorageGet('JerkSimulator.language'):'en';
  currentTheme=safeStorageGet('JerkSimulator.theme')==='light'?'light':'dark';
  document.documentElement.dataset.theme=currentTheme;
  byId('languageSelect').value=currentLang; byId('themeSelect').value=currentTheme;
  byId('licenseText').textContent=byId('gpl3-full-license').textContent.trim();
  resetUI();
  applyI18n();
  run();
})();
</script>
</body>
</html>
